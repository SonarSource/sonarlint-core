# TEMPORARY, to be removed before merging: exercises the storage-snapshot job of full-release.yml on 12.3.0.87938.
# That tag predates the generator, so the generator classes are copied from this PR.
name: TMP storage snapshot check

on:
  pull_request:
    paths:
      - .github/workflows/tmp-storage-snapshot-check.yml

jobs:
  storage-snapshot:
    runs-on: sonar-m
    permissions:
      id-token: write
      contents: write
    env:
      RELEASED_VERSION: 12.3.0.87938
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 12.3.0.87938
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr-head
          sparse-checkout: medium-tests/src/test/java/mediumtest/storage
      - name: Copy the generator into the tag checkout
        run: |
          mkdir -p medium-tests/src/test/java/mediumtest/storage
          cp pr-head/medium-tests/src/test/java/mediumtest/storage/StorageSnapshot.java pr-head/medium-tests/src/test/java/mediumtest/storage/StorageSnapshotGenerator.java medium-tests/src/test/java/mediumtest/storage/
          rm -rf pr-head
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - uses: SonarSource/ci-github-actions/config-maven@c3a85ac3a2f67f86966e2fb1fdf9a7c1bdc997dc # 2.2.0
        with:
          artifactory-reader-role: private-reader
          repox-url: https://repox-internal.dev.sonar.build
      - name: Generate storage snapshot
        run: |
          mvn -B install -DskipTests -pl medium-tests -am -P '!its-linux'
          mvn -B exec:java -pl medium-tests -P '!its-linux' \
            -Dexec.mainClass=mediumtest.storage.StorageSnapshotGenerator -Dexec.classpathScope=test \
            -Dexec.args="$RELEASED_VERSION $RUNNER_TEMP/storage-snapshot/$RELEASED_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-snapshot
          path: ${{ runner.temp }}/storage-snapshot
          if-no-files-found: error
