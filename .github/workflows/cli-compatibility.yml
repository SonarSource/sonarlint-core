name: SonarQube CLI compatibility
on:
  push:
    branches:
      - master
  schedule:
    # Check the latest production CLI once per night.
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: sonarQube-cli-compatibility
  cancel-in-progress: true

env:
  CACHE_BACKEND: s3

jobs:
  latest-cli:
    name: Latest production CLI
    runs-on: sonar-xs
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.4.11
      - uses: SonarSource/ci-github-actions/config-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          artifactory-reader-role: private-reader
      - name: Test SLCORE against the latest SonarQube CLI
        run: >-
          mvn -B -Pits -pl its/tests -am
          -Dtest=LatestSonarQubeCliCompatibilityTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
