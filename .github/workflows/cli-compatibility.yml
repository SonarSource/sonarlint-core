name: SonarQube CLI compatibility
on:
  push:
    branches:
      - master
  schedule:
    # Check the latest production CLI once per night.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: sonarQube-cli-compatibility
  cancel-in-progress: true

env:
  CACHE_BACKEND: s3

jobs:
  latest-cli:
    name: Latest production CLI
    runs-on: sonar-xs
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
      - uses: SonarSource/ci-github-actions/config-maven@53ae810e3b8a7473ff7fdcf2cfa12aa5f8f3075a # 2.4.1
        with:
          artifactory-reader-role: private-reader
      - name: Test SLCORE against the latest SonarQube CLI
        run: >-
          mvn -B -Pits -pl its/tests -am
          -Dtest=LatestSonarQubeCliCompatibilityTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
