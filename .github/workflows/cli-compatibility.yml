name: SonarQube CLI compatibility
on:
  push:
    branches:
      - master
  schedule:
    # Check the latest production CLI once per night.
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: sonarQube-cli-compatibility
  cancel-in-progress: true

env:
  CACHE_BACKEND: s3

jobs:
  latest-cli:
    name: Latest production CLI
    runs-on: sonar-xs
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.9.14
      - uses: SonarSource/ci-github-actions/config-maven@62463382a24f2004ffa20adbe9985f6459e031e6 # 2.3.0
        with:
          artifactory-reader-role: private-reader
      - name: Test SLCORE against the latest SonarQube CLI
        run: >-
          mvn -B -Pits -pl its/tests -am
          -Dtest=LatestSonarQubeCliCompatibilityTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
