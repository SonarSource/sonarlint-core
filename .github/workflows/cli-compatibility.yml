name: SonarQube CLI compatibility
on:
  push:
    branches:
      - master
  schedule:
    # Check the latest production CLI once per night.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: sonarQube-cli-compatibility
  cancel-in-progress: true

env:
  CACHE_BACKEND: s3

jobs:
  latest-cli:
    name: Latest production CLI
    runs-on: sonar-xs
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.14
      - uses: SonarSource/ci-github-actions/config-maven@b4eede988476ebb13a242fbc3ae4e8e374d78ad0 # 2.5.1
        with:
          artifactory-reader-role: private-reader
      - name: Test SLCORE against the latest SonarQube CLI
        run: >-
          mvn -B -Pits -pl its/tests -am
          -Dtest=LatestSonarQubeCliCompatibilityTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
